<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2C3A2E">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Bản đồ và cẩm nang điểm đến Đà Lạt cho khách Grandview Hotel. Bản thử nghiệm.">
  <title>Khám phá Đà Lạt | Grandview Hotel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Great+Vibes&family=Newsreader:opsz,wght@6..72,400..500&display=swap" rel="stylesheet">
  <link rel="icon" href="grandview-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=2">
  <style>
    /* Trang khám phá: cùng ngôn ngữ thiết kế với trang chủ, thêm bản đồ sơ đồ hóa. */
    .ex-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: 1.1rem 0; }
    .ex-head-right { display: flex; align-items: center; gap: .6rem; }
    .beta-tag {
      display: inline-flex; align-items: center; min-height: 24px; padding: .1rem .6rem;
      border: 1px solid var(--cloud); border-radius: var(--radius-pill);
      font-size: .7rem; font-weight: 600; color: var(--stone); letter-spacing: .02em;
    }
    /* Nút VI / EN dùng chung, định nghĩa trong style.css (.lang-switch) */

    .ex-title { max-width: 60ch; margin-bottom: 1.25rem; }
    .ex-title h1 { font-size: clamp(2rem, 1.3rem + 2.6vw, 3rem); font-weight: 300; line-height: 1.12; letter-spacing: -.02em; color: var(--moss); }
    .ex-title p { margin-top: .6rem; color: var(--stone); font-size: .92rem; }

    .ex-bar { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1rem; margin-bottom: 1.25rem; }
    .view-switch { display: inline-flex; gap: .4rem; }
    .view-switch button {
      min-height: 40px; padding: .45rem 1.1rem;
      border: 1px solid var(--cloud); border-radius: var(--radius-pill);
      background: transparent; font-size: .85rem; font-weight: 500;
    }
    .view-switch button[aria-pressed="true"] { background: var(--pine); border-color: var(--pine); color: var(--white); }
    .cat-filter { display: flex; flex-wrap: wrap; gap: .4rem; }
    .cat-filter button {
      min-height: 36px; padding: .3rem .85rem;
      border: 1px solid var(--line); border-radius: var(--radius-pill);
      background: var(--paper); font-size: .8rem; color: var(--pine-soft);
    }
    .cat-filter button[aria-pressed="true"] { background: var(--jade-light); border-color: var(--jade-light); color: var(--pine); font-weight: 500; }

    .ex-layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 1.5rem; align-items: start; }

    /* Bản đồ */
    .map-frame {
      position: relative; overflow: hidden;
      border: 1px solid var(--line); border-radius: var(--radius-m); background: var(--mist);
    }
    .map-frame > svg { display: block; width: 100%; height: auto; }
    .pin {
      position: absolute; z-index: 2; transform: translate(-50%, -100%);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 0; border: 0; background: none; color: var(--pine);
    }
    .pin-dot {
      display: grid; place-items: center; width: 26px; height: 26px;
      border: 2px solid var(--paper); border-radius: 50% 50% 50% 4px;
      transform: rotate(45deg); background: var(--jade);
      box-shadow: 0 2px 6px rgba(18, 26, 20, .35);
    }
    .pin-dot span { transform: rotate(-45deg); font-size: .7rem; font-weight: 600; color: var(--white); }
    .pin-label {
      position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%);
      max-width: 16ch; padding: .1rem .45rem; border-radius: 6px;
      background: var(--pine); color: var(--white);
      font-size: .7rem; line-height: 1.25; text-align: center; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity .12s;
    }
    .pin:hover .pin-label, .pin:focus-visible .pin-label,
    .pin[aria-pressed="true"] .pin-label, .pin-hotel .pin-label { opacity: 1; }
    .pin:hover, .pin:focus-visible, .pin[aria-pressed="true"] { z-index: 3; }
    .pin[aria-pressed="true"] .pin-dot { background: var(--honey); transform: rotate(45deg) scale(1.18); }
    .pin-hotel .pin-dot { background: var(--pine); border-radius: 50%; transform: none; }
    .pin-hotel .pin-dot span { transform: none; }
    .map-note { margin-top: .5rem; font-size: .76rem; color: var(--stone); }
    .map-legend { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .75rem; }
    .map-legend button {
      display: inline-flex; align-items: center; gap: .4rem;
      min-height: 32px; padding: .2rem .7rem .2rem .3rem;
      border: 1px solid var(--line); border-radius: var(--radius-pill);
      background: var(--paper); font-size: .78rem; color: var(--pine-soft);
    }
    .map-legend b {
      display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
      background: var(--jade); color: var(--white); font-size: .68rem; font-weight: 600;
    }
    .map-legend button[aria-pressed="true"] { border-color: var(--jade); background: var(--jade-tint); }
    .map-legend button[aria-pressed="true"] b { background: var(--honey); }

    /* Danh sách */
    .place-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .9rem; }
    .place-card {
      display: flex; flex-direction: column; gap: .3rem; padding: 1rem; text-align: left;
      border: 1px solid var(--line); border-radius: var(--radius-m); background: var(--paper);
    }
    .place-card:hover { border-color: var(--jade); }
    .place-card[aria-pressed="true"] { border-color: var(--jade); box-shadow: 0 0 0 2px var(--jade-tint); }
    .place-card h3 { font-size: 1rem; font-weight: 500; }
    .place-card p { font-size: .82rem; color: var(--stone); }
    .place-meta { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .3rem; }
    .tag {
      padding: .12rem .55rem; border: 1px solid var(--line); border-radius: var(--radius-pill);
      font-size: .7rem; color: var(--pine-soft);
    }

    /* Chi tiết */
    .detail {
      position: sticky; top: 1rem;
      padding: 1.25rem; border: 1px solid var(--line); border-radius: var(--radius-m); background: var(--paper);
    }
    .detail h2 { font-size: 1.4rem; font-weight: 300; color: var(--moss); }
    .detail > p { margin-top: .5rem; font-size: .9rem; }
    .detail dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .3rem .9rem; margin: 1rem 0; font-size: .86rem; }
    .detail dt { color: var(--stone); }
    .detail dd { margin: 0; }
    .detail-tip { padding: .7rem .9rem; border-radius: 12px; background: var(--jade-tint); font-size: .84rem; }
    .detail-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; }
    .detail-empty { color: var(--stone); font-size: .88rem; }

    /* Lịch trình */
    .plan { margin-top: 2.5rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
    .plan h2 { font-size: clamp(1.5rem, 1.2rem + 1.4vw, 2.1rem); font-weight: 300; color: var(--moss); }
    .plan-tabs { display: flex; gap: .5rem; margin: 1rem 0 1.25rem; flex-wrap: wrap; }
    .plan-tabs button {
      min-height: 40px; padding: .45rem 1.1rem;
      border: 1px solid var(--cloud); border-radius: var(--radius-pill); background: transparent; font-size: .85rem;
    }
    .plan-tabs button[aria-selected="true"] { background: var(--jade); border-color: var(--jade); color: var(--white); }
    .plan-day { max-width: 70ch; }
    .plan-day > p { color: var(--stone); font-size: .9rem; margin-bottom: 1rem; }
    .plan-stop { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: .5rem 1rem; padding: .85rem 0; border-top: 1px solid var(--line); }
    .plan-time { font-size: .82rem; color: var(--stone); font-variant-numeric: tabular-nums; }
    .plan-stop strong { font-weight: 500; }
    .plan-stop p { font-size: .85rem; color: var(--stone); margin-top: .15rem; }
    .plan-stop button {
      margin-top: .35rem; padding: 0; border: 0; background: none;
      font-size: .8rem; color: var(--jade); text-decoration: underline; text-underline-offset: 3px;
    }


    /* ===== Đầu trang: tiêu đề + thời tiết ===== */
    .ex-hero { display: grid; gap: 1.25rem; margin-bottom: 1.5rem; }
    .ex-hero .ex-title { margin-bottom: 0; }
    .ex-eyebrow { margin-bottom: .5rem; font-size: .7rem; font-weight: 600; letter-spacing: .14em; color: var(--jade); }

    /* ===== Thời tiết (chuyển từ index.CNfa0ei_.css, đổi sang biến màu Grandview) ===== */
    .mountain-weather { isolation: isolate; position: relative; overflow: hidden; min-width: 0; padding: 20px 20px 14px; border: 1px solid #d5ddce; border-radius: var(--radius-m); background: #f1f3e9; color: var(--pine); box-shadow: 0 5px 16px rgba(22, 62, 48, .035); }
    .mountain-weather .weather-ambient { position: absolute; left: 0; right: 0; bottom: 0; z-index: -2; width: 100%; height: 38%; opacity: .55; pointer-events: none; }
    .mountain-weather::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(rgba(241, 243, 233, .85) 0%, rgba(241, 243, 233, .46) 43%, rgba(241, 243, 233, .7) 70%, rgba(241, 243, 233, .95) 100%); }
    .weather-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .weather-eyebrow { margin-bottom: 6px; font-size: 9px; letter-spacing: 1.6px; color: #61745d; }
    .weather-heading h2 { margin: 0; font-size: 27px; font-weight: 300; letter-spacing: -.6px; color: var(--moss); }
    .weather-heading select { width: 150px; min-height: 44px; padding: 8px; border: 1px solid #ccd6c5; border-radius: var(--radius-s); background: #fafbf5; font: inherit; font-size: 13px; color: var(--pine); }
    .weather-meta { display: flex; justify-content: space-between; gap: 8px; margin: 17px 0 4px; font-size: 10px; color: #61745d; }
    .weather-snapshot-label { margin: 0 0 8px; font-size: 10px; color: #4b6050; }
    .weather-content { min-height: 164px; }
    .weather-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
    .weather-day { display: flex; flex-direction: column; align-items: center; min-width: 0; padding: 10px 1px 8px; border-radius: 6px; text-align: center; font-variant-numeric: tabular-nums; }
    .weather-today { background: #e1e9d8; }
    .weather-day time { display: flex; flex-direction: column; gap: 4px; font-size: 10px; white-space: nowrap; }
    .weather-day time strong { font-weight: 600; }
    .weather-day time span { font-size: 9px; color: #61745d; }
    .weather-icon { display: block; width: 26px; height: 30px; margin: 9px 0 5px; color: #697d6c; }
    .weather-icon svg, .weather-condition svg, .weather-notice-icon svg { width: 100%; height: 100%; }
    .weather-sun { color: #a77b30; }
    .weather-rain, .weather-storm { color: #416d7c; }
    .weather-high { font-size: 18px; font-weight: 600; }
    .weather-low { margin-top: 3px; font-size: 12px; color: #61745d; }
    .weather-day .weather-pop { margin-top: 12px; font-size: 11px; font-weight: 600; color: #416d7c; }
    .weather-status { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 164px; text-align: center; font-size: 13px; color: #61745d; }
    .weather-status button { min-height: 44px; padding: 8px 14px; border: 1px solid #b7c7ae; border-radius: 5px; background: #fafbf5; color: var(--pine); }
    .mountain-weather .weather-stale { max-width: none; margin: 10px 0 0; padding: 8px 10px; border: 1px solid #cbbd8b; border-radius: 5px; background: #fff8e9; font-size: 11px; line-height: 1.5; color: #72551d; }
    .weather-notices { margin-top: 12px; padding: 12px; border: 1px solid #c6d2c0; border-radius: 7px; background: rgba(251, 252, 244, .91); }
    .weather-notices-heading { margin-bottom: 9px; font-size: 10px; color: #52654e; }
    .weather-condition { display: flex; align-items: center; gap: 8px; margin: 4px 0 12px; font-size: 16px; }
    .weather-condition > span { display: block; width: 26px; height: 26px; }
    .weather-condition strong { font-weight: 600; }
    .weather-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #d9dfd2; }
    .weather-metrics > div { min-width: 0; }
    .weather-metrics > div > span, .weather-metrics small { display: block; font-size: 10px; line-height: 1.5; color: #52654e; }
    .weather-metrics strong { display: block; margin: 3px 0; font-size: 15px; font-weight: 600; }
    .weather-gust { display: block; }
    .weather-notice { display: flex; align-items: flex-start; gap: 9px; color: #466476; }
    .weather-notice + .weather-notice { margin-top: 10px; padding-top: 10px; border-top: 1px solid #d9dfd2; }
    .weather-notice-icon { flex: 0 0 23px; width: 23px; height: 25px; margin-top: 1px; }
    .mountain-weather .weather-notice p { max-width: none; margin: 0 0 3px; font-size: 13px; font-weight: 600; line-height: 1.45; color: var(--pine); }
    .weather-notice small { display: block; font-size: 10px; line-height: 1.5; color: #52654e; }
    .weather-notice-storm { color: #975533; }
    .weather-notice-sun { color: #a77b30; }
    .weather-notice-fog { color: #687665; }
    .weather-notice-wind { color: #85603a; }
    .weather-notice-cold { color: #3f5f86; }
    .mountain-weather .weather-note { max-width: none; margin: 12px 0 7px; font-size: 11px; line-height: 1.5; color: #61745d; }
    .weather-footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 7px; margin-top: 12px; padding-top: 10px; border-top: 1px solid #d5ddce; font-size: 9px; color: #61745d; }
    .weather-footer a { text-decoration: underline; text-underline-offset: 2px; }
    @media (min-width: 901px) {
      .mountain-weather { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); column-gap: 1.5rem; align-items: start; }
      .mountain-weather > .weather-ambient { grid-column: 1 / -1; }
      .weather-col-main { grid-column: 1; }
      .weather-col-side { grid-column: 2; }
      .weather-col-side .weather-notices { margin-top: 0; }
    }
    .weather-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    /* ===== Dải liên hệ cuối trang ===== */
    .connect-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; margin-top: 2.5rem; padding: 16px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .feedback-prompt { margin: 0; white-space: nowrap; color: var(--stone); }
    .feedback-prompt a { margin-left: 7px; font-weight: 600; color: var(--pine); }
    .strip-phone { white-space: nowrap; }
    .strip-socials { display: flex; align-items: center; gap: 4px; }
    .strip-socials a { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 50%; color: var(--pine); }
    .strip-socials a:hover { background: var(--jade-tint); }
    .strip-socials svg { width: 21px; height: 21px; }
    .strip-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-left: auto; }
    .strip-actions a { min-height: 44px; white-space: nowrap; }

    .ex-foot-grid { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem 2rem; }
    .ex-foot-links { display: flex; flex-wrap: wrap; gap: .4rem 1.1rem; }
    .ex-foot-links a { color: var(--pine-soft); text-decoration: underline; text-underline-offset: 3px; }
    .ex-foot-note { margin-top: .9rem; }

    .ex-foot { margin-top: 1.5rem; padding: 1.25rem 0 2rem; border-top: 1px solid var(--line); font-size: .78rem; color: var(--stone); }

    @media (max-width: 900px) {
      .ex-layout { grid-template-columns: 1fr; }
      .detail { position: static; }
      .pin-label { display: none; }

    }

    @media (max-width: 720px) {
      .connect-strip { gap: 10px 14px; font-size: 12px; }
      .feedback-prompt, .strip-phone { width: 100%; }
      .strip-actions { margin-left: 0; }
    }
    @media (max-width: 420px) {
      .mountain-weather { padding: 16px 10px 12px; }
      .weather-heading { gap: 6px; }
      .weather-heading h2 { font-size: 24px; }
      .weather-heading select { width: 124px; padding: 8px 4px; font-size: 16px; }
      .weather-eyebrow { font-size: 8px; letter-spacing: 1.1px; }
      .weather-day time { font-size: 9px; }
      .weather-day time span { font-size: 8px; }
      .weather-high { font-size: 17px; }
      .weather-days { gap: 1px; }
      .weather-meta, .weather-footer { font-size: 9px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="ex-head">
      <a class="brand" href="/" aria-label="Grandview Hotel, về trang chủ" data-i18n-attr="aria-label:brand.home">
        <span class="brand-logo" aria-hidden="true"><svg viewBox="0 0 64 64"><path class="mark-arch" d="M8 60V30a24 24 0 0 1 48 0v30z"/><circle class="mark-sun" cx="41" cy="25" r="6"/><path class="mark-tree" d="M15 52l9-20 9 20z M27 52l8-15 8 15z M37 52l7-12 7 12z"/><rect class="mark-ground" x="12" y="52" width="40" height="2.5" rx="1.25"/></svg></span>
        <span class="brand-words">
          <span class="brand-mark">Grandview</span>
          <span class="brand-sub" data-i18n="brand.sub">Khách sạn &amp; nghỉ dưỡng</span>
        </span>
      </a>
      <div class="ex-head-right">
        <span class="beta-tag" id="betaTag">Bản thử nghiệm</span>
        <div class="lang-switch" role="group" aria-label="Ngôn ngữ" id="langSwitch" data-lang-switch>
          <button type="button" data-lang="vi" aria-pressed="true" lang="vi" title="Tiếng Việt">VI</button>
          <button type="button" data-lang="en" aria-pressed="false" lang="en" title="English">EN</button>
        </div>
      </div>
    </header>

    <main>
      <div class="ex-hero">
        <div class="ex-title">
          <div class="ex-eyebrow" id="pageEyebrow"></div>
          <h1 id="pageTitle"></h1>
          <p id="pageLead"></p>
        </div>

        <!-- Thời tiết 7 ngày. Dữ liệu lấy qua /api/weather (app/main.py), dự phòng gọi thẳng Open-Meteo. -->
        <section class="mountain-weather" id="weather" aria-labelledby="weatherTitle">
          <svg class="weather-ambient" viewBox="0 0 400 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
            <path d="M0 100V62l38-14 46 18 58-30 64 26 56-20 66 24 72-22v56z" fill="#c9d3b6" opacity=".7"/>
            <path d="M0 100V78l52-10 60 14 70-16 64 12 74-14 80 10v26z" fill="#b5c39d" opacity=".55"/>
          </svg>
          <div class="weather-col-main">
          <div class="weather-heading">
            <div>
              <div class="weather-eyebrow" id="weatherEyebrow"></div>
              <h2 id="weatherTitle"></h2>
            </div>
            <label>
              <span class="weather-sr-only" id="weatherAreaLabel"></span>
              <select id="weatherArea"></select>
            </label>
          </div>
          <div class="weather-meta"><span id="weatherMeta"></span></div>
          <div class="weather-snapshot-label" id="weatherSnapshot"></div>
          <div class="weather-content" id="weatherContent" aria-busy="true"></div>
          <p class="weather-stale" id="weatherStale" hidden></p>
          <p class="weather-note" id="weatherNote"></p>
          <div class="weather-footer">
            <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer" id="weatherSource"></a>
            <time id="weatherUpdated"></time>
          </div>
          <noscript><p class="weather-note">Bật JavaScript để xem dự báo thời tiết.</p></noscript>
          </div>
          <div class="weather-col-side">
            <aside class="weather-notices" id="weatherNotices" aria-live="polite" aria-atomic="true" hidden></aside>
          </div>
        </section>
      </div>

      <div class="ex-bar">
        <div class="view-switch" role="group" aria-label="Chế độ xem" id="viewSwitch">
          <button type="button" data-view="map" aria-pressed="true"></button>
          <button type="button" data-view="list" aria-pressed="false"></button>
        </div>
        <div class="cat-filter" role="group" aria-label="Nhóm điểm đến" id="catFilter"></div>
      </div>

      <div class="ex-layout">
        <section id="mapView" aria-labelledby="pageTitle">
          <div class="map-frame" id="mapFrame">
            <svg viewBox="0 0 700 1200" role="img" aria-labelledby="mapTitleText">
              <title id="mapTitleText">Sơ đồ vị trí các điểm đến quanh Đà Lạt</title>
              <rect width="700" height="1200" fill="#F5F2EA"/>
              <!-- vùng rừng thông -->
              <g fill="#D3DCB4" opacity=".55">
                <path d="M60 200l14-30 14 30z M100 250l12-26 12 26z M48 320l13-28 13 28z M150 150l12-26 12 26z"/>
                <path d="M600 260l14-30 14 30z M560 330l12-26 12 26z M640 420l13-28 13 28z M520 200l12-26 12 26z"/>
                <path d="M90 900l14-30 14 30z M150 980l12-26 12 26z M60 1050l13-28 13 28z M200 1100l12-26 12 26z"/>
                <path d="M590 980l14-30 14 30z M640 1080l12-26 12 26z M540 1120l13-28 13 28z"/>
                <path d="M430 1060l14-30 14 30z M470 1140l12-26 12 26z"/>
              </g>

    // Mã thời tiết WMO mà Open-Meteo trả về.
    function weatherKind(code) {
      if (code === 0) return { icon: "sun", tone: "sun", vi: "Trời quang", en: "Clear" };
      if (code === 1 || code === 2) return { icon: "partly", tone: "sun", vi: "Ít mây", en: "Partly cloudy" };
      if (code === 3) return { icon: "cloud", tone: "cloud", vi: "Nhiều mây", en: "Overcast" };
      if (code === 45 || code === 48) return { icon: "fog", tone: "fog", vi: "Sương mù", en: "Fog" };
      if (code >= 51 && code <= 57) return { icon: "drizzle", tone: "rain", vi: "Mưa phùn", en: "Drizzle" };
      if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return { icon: "rain", tone: "rain", vi: "Mưa", en: "Rain" };
      if (code >= 71 && code <= 86) return { icon: "cold", tone: "cloud", vi: "Mưa tuyết", en: "Snow" };
      if (code >= 95) return { icon: "storm", tone: "storm", vi: "Giông", en: "Thunderstorms" };
      return { icon: "cloud", tone: "cloud", vi: "Không rõ", en: "Unknown" };
    }

    const weather = { area: "da-lat", data: null, mode: null, status: "loading", request: 0 };

    async function fetchWeather(areaId) {
      // 1) Bản dự báo dùng chung, máy chủ đã lưu tạm (app/main.py: GET /api/weather).
      try {
        const response = await fetch(`/api/weather?area=${encodeURIComponent(areaId)}`, { headers: { Accept: "application/json" } });
        if (response.ok) return { mode: "shared", data: await response.json() };
      } catch (error) { /* chuyển sang dự phòng */ }
      // 2) Dự phòng khi mở trang không qua FastAPI hoặc máy chủ không ra được Internet.
      const area = WEATHER_AREAS.find(item => item.id === areaId);
      const params = new URLSearchParams({
        latitude: area.lat, longitude: area.lng, timezone: "Asia/Ho_Chi_Minh", forecast_days: "7",
        daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
        current: "temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,wind_gusts_10m",
        hourly: "precipitation_probability",
      });
      const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
      if (!response.ok) throw new Error(`Open-Meteo ${response.status}`);
      const data = await response.json();
      return { mode: "direct", data: { ...data, fetched_at: new Date().toISOString(), stale: false } };
    }

    async function loadWeather() {
      const ticket = ++weather.request;
      weather.status = "loading";
      renderWeather();
      try {
        const result = await fetchWeather(weather.area);
        if (ticket !== weather.request) return; // người dùng đã đổi khu vực
        weather.data = result.data;
        weather.mode = result.mode;
        weather.status = "ready";
      } catch (error) {
        if (ticket !== weather.request) return;
        weather.status = "error";
      }
      renderWeather();
    }

    const pad2 = value => String(value).padStart(2, "0");
    function dayLabel(iso, index) {
      const [year, month, day] = iso.split("-").map(Number);
      const date = new Date(Date.UTC(year, month - 1, day));
      const name = index === 0 ? t("wToday")
        : date.toLocaleDateString(state.lang === "vi" ? "vi-VN" : "en-GB", { weekday: "short", timeZone: "UTC" });
      return { name, short: `${pad2(day)}/${pad2(month)}` };
    }

    function windWord(speed) {
      if (speed < 6) return state.lang === "vi" ? "Lặng gió" : "Calm";
      if (speed < 20) return state.lang === "vi" ? "Gió nhẹ" : "Breezy";
      if (speed < 39) return state.lang === "vi" ? "Gió vừa" : "Windy";
      return state.lang === "vi" ? "Gió mạnh" : "Strong wind";
    }

    function humidityWord(value) {
      if (value >= 85) return state.lang === "vi" ? "Ẩm, dễ có sương" : "Humid, mist likely";
      if (value >= 60) return state.lang === "vi" ? "Dễ chịu" : "Comfortable";
      return state.lang === "vi" ? "Hanh khô" : "Dry";
    }

    function currentPrecip(data) {
      const hourly = data.hourly || {};
      const times = hourly.time || [];
      const values = hourly.precipitation_probability || [];
      const now = (data.current && data.current.time) || "";
      const hourKey = now.slice(0, 13);
      const index = times.findIndex(time => time.slice(0, 13) === hourKey);
      if (index >= 0 && values[index] != null) return values[index];
      const daily = data.daily.precipitation_probability_max || [];
      return daily[0] ?? null;
    }

    function weatherNotices(data, precip) {
      const vi = state.lang === "vi";
      const current = data.current;
      const today = weatherKind(data.daily.weather_code[0]);
      const low = data.daily.temperature_2m_min[0];
      const list = [];
      if (today.tone === "storm" || weatherKind(current.weather_code).tone === "storm") {
        list.push({ tone: "storm", icon: "storm", text: vi ? "Có thể có giông, hạn chế leo núi và chèo thuyền." : "Thunderstorms possible; avoid hikes and boat trips.", small: vi ? "Theo dõi lại trước khi lên Langbiang hoặc ra hồ." : "Check again before heading up Langbiang or onto the lake." });
      } else if (precip != null && precip >= 50) {
        list.push({ tone: "rain", icon: "rain", text: vi ? "Có thể mưa, nhớ mang áo mưa nhé!" : "Rain is possible — bring a raincoat!", small: vi ? "Lễ tân có cho mượn ô và áo mưa." : "Reception lends umbrellas and raincoats." });
      }
      if (weatherKind(current.weather_code).tone === "fog") {
        list.push({ tone: "fog", icon: "fog", text: vi ? "Sương mù dày, lái xe chậm và bật đèn." : "Thick fog: drive slowly with lights on.", small: vi ? "Đường đèo Prenn và Mimosa dễ khuất tầm nhìn." : "The Prenn and Mimosa passes lose visibility first." });
      }
      if (current.wind_gusts_10m != null && current.wind_gusts_10m >= 40) {
        list.push({ tone: "wind", icon: "wind", text: vi ? "Gió giật mạnh, cẩn thận khi đi xe máy." : "Strong gusts: take care on a motorbike.", small: `${vi ? "Giật" : "Gusts"} ${Math.round(current.wind_gusts_10m)} km/h` });
      }
      if (low != null && low <= 15) {
        list.push({ tone: "cold", icon: "cold", text: vi ? `Sáng sớm và tối khoảng ${Math.round(low)}°, mang thêm áo ấm.` : `Early morning and night near ${Math.round(low)}°; pack a warm layer.`, small: vi ? "Trên đỉnh núi lạnh hơn trung tâm vài độ." : "Summits run a few degrees colder than town." });
      }
      if (!list.length && today.tone === "sun") {
        list.push({ tone: "sun", icon: "sun", text: vi ? "Trời đẹp, hợp để đi dạo hồ và săn mây sớm." : "Fine weather for a lake walk and an early cloud hunt.", small: vi ? "Nắng cao nguyên mạnh, nhớ kem chống nắng." : "Highland sun is strong; wear sunscreen." });
      }
      return list;
    }

    function renderWeather() {
      $("#weatherEyebrow").textContent = t("wEyebrow");
      $("#weatherTitle").textContent = t("wTitle");
      $("#weatherAreaLabel").textContent = t("wArea");
      $("#weatherMeta").textContent = t("wMeta");
      $("#weatherNote").textContent = t("wNote");
      $("#weatherSource").textContent = t("wSource");
      const select = $("#weatherArea");
      select.innerHTML = WEATHER_AREAS.map(area =>
        `<option value="${area.id}"${area.id === weather.area ? " selected" : ""}>${esc(area[state.lang])}</option>`).join("");

      const content = $("#weatherContent");
      const notices = $("#weatherNotices");
      const stale = $("#weatherStale");
      content.setAttribute("aria-busy", String(weather.status === "loading"));

      if (weather.status === "loading" && !weather.data) {
        content.innerHTML = `<div class="weather-status">${esc(t("wLoading"))}</div>`;
        notices.hidden = true; stale.hidden = true;
        $("#weatherSnapshot").textContent = ""; $("#weatherUpdated").textContent = "";
        return;
      }
      if (weather.status === "error") {
        content.innerHTML = `<div class="weather-status"><span>${esc(t("wError"))}</span><button type="button" id="weatherRetry">${esc(t("wRetry"))}</button></div>`;
        notices.hidden = true; stale.hidden = true;
        $("#weatherSnapshot").textContent = ""; $("#weatherUpdated").textContent = "";
        return;
      }

      const data = weather.data;
      const daily = data.daily;
      const areaName = WEATHER_AREAS.find(area => area.id === weather.area)[state.lang];
      $("#weatherSnapshot").textContent = weather.mode === "shared" ? t("wShared") : t("wDirect");

      content.innerHTML = `<div class="weather-days" role="list" aria-label="${esc(`${areaName} · ${t("wMeta")}`)}">` +
        daily.time.map((iso, index) => {
          const kind = weatherKind(daily.weather_code[index]);
          const label = dayLabel(iso, index);
          const high = Math.round(daily.temperature_2m_max[index]);
          const low = Math.round(daily.temperature_2m_min[index]);
          const pop = daily.precipitation_probability_max ? daily.precipitation_probability_max[index] : null;
          return `<div class="weather-day${index === 0 ? " weather-today" : ""}" role="listitem">
            <time datetime="${iso}"><strong>${esc(label.name)}</strong><span>${label.short}</span></time>
            <span class="weather-icon weather-${kind.tone}" role="img" aria-label="${esc(kind[state.lang])}" title="${esc(kind[state.lang])}">${ICONS[kind.icon]}</span>
            <strong class="weather-high" aria-label="${esc(t("wHigh"))}: ${high}°C">${high}°</strong>
            <span class="weather-low" aria-label="${esc(t("wLow"))}: ${low}°C">${low}°</span>
            ${pop != null ? `<span class="weather-pop" aria-label="${esc(t("wPrecip"))}: ${pop}%">${pop}%</span>` : ""}
          </div>`;
        }).join("") + "</div>";

      const current = data.current;
      const kindNow = weatherKind(current.weather_code);
      const precip = currentPrecip(data);
      const hourText = (current.time || "").slice(11, 16);
      notices.innerHTML = `
        <div class="weather-notices-heading">${esc(t("wHourly"))} · <time datetime="${esc(current.time || "")}">${esc(hourText)}</time> · ${esc(areaName)} · ${Math.round(current.temperature_2m)}°C</div>
        <div class="weather-condition weather-${kindNow.tone}"><span aria-hidden="true">${ICONS[kindNow.icon]}</span><strong>${esc(kindNow[state.lang])}</strong></div>
        <div class="weather-metrics">
          <div><span>${esc(t("wPrecip"))}</span><strong>${precip != null ? `${precip}%` : "—"}</strong></div>
          <div><span>${esc(t("wHumidity"))}</span><strong>${Math.round(current.relative_humidity_2m)}%</strong><small>${esc(humidityWord(current.relative_humidity_2m))}</small></div>
          <div><span>${esc(t("wWind"))}</span><strong>${Math.round(current.wind_speed_10m)} km/h</strong><small>${esc(windWord(current.wind_speed_10m))}${current.wind_gusts_10m != null ? `<span class="weather-gust">${esc(t("wGust"))} ${Math.round(current.wind_gusts_10m)} km/h</span>` : ""}</small></div>
        </div>` +
        weatherNotices(data, precip).slice(0, 3).map(notice => `
        <div class="weather-notice weather-notice-${notice.tone}">
          <span class="weather-notice-icon" aria-hidden="true">${ICONS[notice.icon]}</span>
          <div><p>${esc(notice.text)}</p><small>${esc(notice.small)}</small></div>
        </div>`).join("");
      notices.setAttribute("aria-label", t("wHourly"));
      notices.hidden = false;

      stale.textContent = t("wStale");
      stale.hidden = !data.stale;

      const fetched = new Date(data.fetched_at);
      const updated = $("#weatherUpdated");
      if (!Number.isNaN(fetched.getTime())) {
        updated.dateTime = fetched.toISOString();
        const parts = Object.fromEntries(new Intl.DateTimeFormat("en-GB", {
          timeZone: "Asia/Ho_Chi_Minh", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23",
        }).formatToParts(fetched).map(part => [part.type, part.value]));
        updated.textContent = `${t("wUpdated")} ${parts.day}/${parts.month}, ${parts.hour}:${parts.minute}`;
      }
    }

    const SOCIAL_ICONS = {
      zalo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 5.5h16v10.5H11l-4.5 3.5V16H4z"/><path d="M8 9h3.2L8 13h3.2M13.5 9v4M16 10.5a1.3 1.3 0 1 0 0 .01" stroke-linecap="round"/></svg>',
      messenger: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3.5c-4.8 0-8.5 3.5-8.5 8 0 2.5 1.2 4.6 3 6v3l2.8-1.6c.9.3 1.8.4 2.7.4 4.8 0 8.5-3.5 8.5-7.8S16.8 3.5 12 3.5z"/><path d="M7.5 13.5l3-3.2 2.2 2 3.8-2.8-3 3.3-2.2-2z" stroke-linecap="round"/></svg>',
      facebook: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 8H17V4.5h-2.5A4 4 0 0 0 10.5 8.5V11H8v3.5h2.5v6h3.5v-6h2.6l.4-3.5h-3V8.8c0-.5.3-.8.5-.8z"/></svg>',
    };

    function renderConnect() {
      const strip = $("#connectStrip");
      strip.setAttribute("aria-label", t("stripLabel"));
      const socials = ["zalo", "messenger", "facebook"].filter(key => CONTACT[key]).map(key =>
        `<a href="${esc(CONTACT[key])}" target="_blank" rel="noopener noreferrer" aria-label="${key === "zalo" ? "Zalo" : key === "messenger" ? "Messenger" : "Facebook"}" title="${key === "zalo" ? "Zalo" : key === "messenger" ? "Messenger" : "Facebook"}">${SOCIAL_ICONS[key]}</a>`).join("");
      const feedbackHref = CONTACT.zalo || CONTACT.messenger || (CONTACT.phone ? `tel:${CONTACT.phone}` : "/#contact");
      strip.innerHTML = `
        <p class="feedback-prompt">${esc(t("feedback"))}<a href="${esc(feedbackHref)}"${/^https?:/.test(feedbackHref) ? ' target="_blank" rel="noopener noreferrer"' : ""}>${esc(t("feedbackLink"))}</a></p>
        ${CONTACT.phone ? `<a class="strip-phone" href="tel:${esc(CONTACT.phone)}">${esc(t("callReception"))} · ${esc(CONTACT.phoneLabel || CONTACT.phone)}</a>` : ""}
        ${socials ? `<div class="strip-socials">${socials}</div>` : ""}
        <div class="strip-actions">
          <a class="secondary-button" href="/#rooms">${esc(t("bookRoom"))}</a>
          <a class="secondary-button" href="/#room-service">${esc(t("roomService"))}</a>
        </div>`;
    }

    function renderFoot() {
      $("#exFoot").innerHTML = `
        <div class="ex-foot-grid">
          <nav class="ex-foot-links" aria-label="${state.lang === "vi" ? "Liên kết cuối trang" : "Footer links"}">
            <a href="/">${esc(t("footHome"))}</a>
            <a href="/#rooms">${esc(t("footRooms"))}</a>
            <a href="/#lookup">${esc(t("footLookup"))}</a>
            <a href="/#room-service">${esc(t("footService"))}</a>
          </nav>
          ${CONTACT.phone ? `<a href="tel:${esc(CONTACT.phone)}">${esc(t("callReception"))} · ${esc(CONTACT.phoneLabel || CONTACT.phone)}</a>` : ""}
        </div>
        <p class="ex-foot-note">${esc(t("foot"))}</p>`;
    }

    const state = { lang: "vi", view: "map", cat: "all", selected: null, day: 0 };
    const $ = selector => document.querySelector(selector);
    const esc = (value = "") => String(value).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    })[c]);
    const t = key => T[key][state.lang];
    const placeById = id => PLACES.find(place => place.id === id);

    function readUrl() {
      const params = new URLSearchParams(location.search);
      // Ngôn ngữ dùng chung với trang chủ và trang dịch vụ (i18n.js): ?lang= rồi lựa chọn đã lưu
      state.lang = window.GV_I18N.lang;
      if (params.get("view") === "list") state.view = "list";
      const place = params.get("place");
      if (place && placeById(place)) state.selected = place;
      const area = params.get("weather");
      if (area && WEATHER_AREAS.some(item => item.id === area)) weather.area = area;
    }

    function writeUrl() {
      const params = new URLSearchParams();
      params.set("lang", state.lang);
      params.set("view", state.view);
      if (state.selected) params.set("place", state.selected);
      if (weather.area !== "da-lat") params.set("weather", weather.area);
      history.replaceState(null, "", `${location.pathname}?${params}`);
    }

    function visiblePlaces() {
      return state.cat === "all" ? PLACES : PLACES.filter(place => place.cat === state.cat);
    }

    function mapsLink(place) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${place.name.vi} Đà Lạt`)}`;
    }

    // Vùng trung tâm nhiều điểm sát nhau, lệch nhẹ vài ghim cho dễ bấm.
    const NUDGE = {
      "cho-da-lat": [-4, -2.2],
      "nha-tho-con-ga": [-1, 1.6],
      "quang-truong-lam-vien": [3.5, 1.4],
      "vuon-hoa-thanh-pho": [1, -2.4],
      "crazy-house": [-2.5, 2.4],
      "dinh-bao-dai": [-4, 0.8],
    };

    function position(lat, lng, id) {
      const offset = NUDGE[id] || [0, 0];
      const x = (lng - BOUNDS.lngMin) / (BOUNDS.lngMax - BOUNDS.lngMin) * 100 + offset[0];
      const y = (BOUNDS.latMax - lat) / (BOUNDS.latMax - BOUNDS.latMin) * 100 + offset[1];
      return { x: Math.min(97, Math.max(3, x)), y: Math.min(96, Math.max(3, y)) };
    }

    function renderPins() {
      const frame = $("#mapFrame");
      frame.querySelectorAll(".pin").forEach(pin => pin.remove());
      const hotel = position(HOTEL.lat, HOTEL.lng);
      const hotelPin = document.createElement("div");
      hotelPin.className = "pin pin-hotel";
      hotelPin.style.left = `${hotel.x}%`;
      hotelPin.style.top = `${hotel.y}%`;
      hotelPin.innerHTML = `<span class="pin-dot"><span>G</span></span><span class="pin-label">${esc(t("hotel"))}</span>`;
      frame.append(hotelPin);

      visiblePlaces().filter(place => !place.offMap).forEach((place, index) => {
        const spot = position(place.lat, place.lng, place.id);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "pin";
        button.dataset.place = place.id;
        button.style.left = `${spot.x}%`;
        button.style.top = `${spot.y}%`;
        button.setAttribute("aria-pressed", String(state.selected === place.id));
        button.innerHTML = `<span class="pin-dot"><span>${index + 1}</span></span>
          <span class="pin-label">${esc(place.name[state.lang])}</span>`;
        frame.append(button);
      });

      $("#mapLegend").innerHTML = visiblePlaces().filter(place => !place.offMap).map((place, index) =>
        `<button type="button" data-place="${place.id}" aria-pressed="${state.selected === place.id}">
           <b>${index + 1}</b>${esc(place.name[state.lang])}
         </button>`).join("");
    }

    function renderList() {
      const places = visiblePlaces();
      if (!places.length) {
        $("#placeGrid").innerHTML = `<p class="detail-empty">${esc(t("empty"))}</p>`;
        return;
      }
      $("#placeGrid").innerHTML = places.map(place => `
        <button type="button" class="place-card" data-place="${place.id}" aria-pressed="${state.selected === place.id}">
          <h3>${esc(place.name[state.lang])}</h3>
          <p>${esc(place.desc[state.lang].split(". ")[0].replace(/\.$/, ""))}.</p>
          <span class="place-meta">
            <span class="tag">${esc(place.time[state.lang])}</span>
            <span class="tag">${place.km} km</span>
            ${place.offMap ? `<span class="tag">${esc(t("offMap"))}</span>` : ""}
          </span>
        </button>`).join("");
    }

    function renderDetail() {
      const place = state.selected ? placeById(state.selected) : null;
      if (!place) {
        $("#detail").innerHTML = `<p class="detail-empty">${esc(state.view === "map" ? t("pickPlace") : t("pickPlaceList"))}</p>`;
        return;
      }
      $("#detail").innerHTML = `
        <h2>${esc(place.name[state.lang])}</h2>
        <p>${esc(place.desc[state.lang])}</p>
        <dl>
          <dt>${esc(t("timeLabel"))}</dt><dd>${esc(place.time[state.lang])}</dd>
          <dt>${esc(t("bestLabel"))}</dt><dd>${esc(place.best[state.lang])}</dd>
          <dt>${esc(t("feeLabel"))}</dt><dd>${esc(place.fee[state.lang])}</dd>
          <dt>${esc(t("distLabel"))}</dt><dd>${place.km} km</dd>
        </dl>
        <p class="detail-tip">${esc(place.tip[state.lang])}</p>
        <div class="detail-actions">
          <a class="secondary-button" href="${mapsLink(place)}" target="_blank" rel="noopener">${esc(t("maps"))}</a>
        </div>`;
    }

    function renderPlan() {
      $("#planTitle").textContent = t("planTitle");
      $("#planTabs").innerHTML = ITINERARY.map((day, index) =>
        `<button type="button" role="tab" data-day="${index}" aria-selected="${index === state.day}">${esc(day.day[state.lang])}</button>`).join("");
      const day = ITINERARY[state.day];
      $("#planDay").innerHTML = `<p>${esc(day.lead[state.lang])}</p>` + day.stops.map(stop => {
        const place = placeById(stop.place) || placeById(stop.fallback);
        if (!place) return "";
        return `<div class="plan-stop">
          <span class="plan-time">${esc(stop.time[state.lang])}</span>
          <div>
            <strong>${esc(place.name[state.lang])}</strong>
            <p>${esc(stop.note[state.lang])}</p>
            <button type="button" data-plan-place="${place.id}">${esc(t("showOnMap"))}</button>
          </div>
        </div>`;
      }).join("");
    }

    function renderChrome() {
      document.documentElement.lang = state.lang;
      $("#pageTitle").textContent = t("title");
      $("#pageLead").textContent = t("lead");
      $("#betaTag").textContent = t("beta");
      $("#mapNote").textContent = t("mapNote");
      $("#pageEyebrow").textContent = t("eyebrow");
      document.title = `${t("title")} | Grandview Hotel`;
      $("#viewSwitch").querySelectorAll("[data-view]").forEach(button => {
        button.textContent = t(button.dataset.view);
        button.setAttribute("aria-pressed", String(button.dataset.view === state.view));
      });
      $("#langSwitch").querySelectorAll("[data-lang]").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.lang === state.lang));
      });
      $("#catFilter").innerHTML = CATEGORIES.map(category =>
        `<button type="button" data-cat="${category.id}" aria-pressed="${category.id === state.cat}">${esc(category[state.lang])}</button>`).join("");
      $("#mapView").hidden = state.view !== "map";
      $("#listView").hidden = state.view !== "list";
    }

    function render() {
      renderChrome();
      if (state.view === "map") renderPins(); else renderList();
      renderDetail();
      renderPlan();
      renderWeather();
      renderConnect();
      renderFoot();
      writeUrl();
    }

    function select(id) {
      state.selected = state.selected === id ? null : id;
      render();
    }

    document.addEventListener("click", event => {
      // Nút VI / EN do i18n.js xử lý; trang vẽ lại qua sự kiện gv:langchange bên dưới
      if (event.target.closest("[data-lang-switch]")) return;
      const view = event.target.closest("[data-view]");
      if (view) { state.view = view.dataset.view; render(); return; }
      const cat = event.target.closest("[data-cat]");
      if (cat) {
        state.cat = cat.dataset.cat;
        const current = state.selected ? placeById(state.selected) : null;
        if (current && state.cat !== "all" && current.cat !== state.cat) state.selected = null;
        render();
        return;
      }
      const planPlace = event.target.closest("[data-plan-place]");
      if (planPlace) {
        const place = placeById(planPlace.dataset.planPlace);
        state.cat = "all";
        state.view = place.offMap ? "list" : "map";
        state.selected = place.id;
        render();
        $("#mapView").hidden ? $("#listView").scrollIntoView({ behavior: "smooth", block: "start" })
                             : $("#mapView").scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }
      const pin = event.target.closest("[data-place]");
      if (pin) { select(pin.dataset.place); return; }
      const day = event.target.closest("[data-day]");
      if (day) { state.day = Number(day.dataset.day); renderPlan(); return; }
      if (event.target.closest("#weatherRetry")) loadWeather();
    });

    $("#weatherArea").addEventListener("change", event => {
      weather.area = event.target.value;
      weather.data = null;
      writeUrl();
      loadWeather();
    });

    document.addEventListener("gv:langchange", event => {
      state.lang = event.detail.lang;
      render();
    });

    readUrl();
    window.GV_I18N.apply();
    render();
    loadWeather();
    // Trang để mở lâu (ví dụ ở sảnh) vẫn tự cập nhật mỗi giờ.
    setInterval(loadWeather, 60 * 60 * 1000);
  })();
  </script>
</body>
</html>
